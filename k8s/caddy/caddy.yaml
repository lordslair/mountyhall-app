#
# kubectl apply -f k8s/caddy/
# kubectl -n caddy create secret generic caddy \
#  --from-literal=OVH_APPLICATION_KEY=... \
#  --from-literal=OVH_APPLICATION_SECRET=... \
#  --from-literal=OVH_CONSUMER_KEY=... \
#  --from-literal=MOUNTYHALL_DOMAIN=... \
#  --from-literal=MOUNTYHALL_API_DOMAIN=...
# Needed to have the secrets safely in the Cluster
#
---
apiVersion: v1
kind: Namespace
metadata:
  name: caddy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy
  namespace: caddy
  labels:
    app: caddy
data:
  Caddyfile: |
    (ovh_tls) {
        tls {
            dns ovh {
                endpoint "ovh-eu"
                application_key {$OVH_APPLICATION_KEY}
                application_secret {$OVH_APPLICATION_SECRET}
                consumer_key {$OVH_CONSUMER_KEY}
            }
        }
    }

    # --- mountyhall ---
    {$MOUNTYHALL_DOMAIN} {
        import ovh_tls
        reverse_proxy mountyhall-frontend.mountyhall.svc.cluster.local:3000
    }

    {$MOUNTYHALL_API_DOMAIN} {
        import ovh_tls
        reverse_proxy mountyhall-backend.mountyhall.svc.cluster.local:5000
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: caddy
  labels:
    app: caddy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: caddy
  labels:
    app: caddy
spec:
  # hostPorts 80/443 can only be bound once per node: stop the old pod before starting the new one
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
        - name: caddy
          image: lordslair/caddy-ovh:2.11.7
          ports:
            # Exposed directly on the node's public IP
            - name: http
              containerPort: 80
              hostPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              hostPort: 443
              protocol: TCP
            - name: http3
              containerPort: 443
              hostPort: 443
              protocol: UDP
          envFrom:
            - secretRef:
                name: caddy
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          # Admin API only listens on localhost, so probe from inside the container
          readinessProbe:
            exec:
              command: ["wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/reverse_proxy/upstreams"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/reverse_proxy/upstreams"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: caddyfile
          configMap:
            name: caddy
        # Certificates live here: keep them across restarts to avoid ACME rate limits
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
        - name: config
          emptyDir: {}
